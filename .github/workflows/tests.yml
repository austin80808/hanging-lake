# The parts of Hanging Lake that run without Unreal: the terrain pipeline and the
# Snell solver (the aiming maths), which compiles against a small Core shim.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e pipeline pytest
      - run: python -m pytest pipeline/tests -q

  snell-solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: game/Tests/SnellSolver/run.sh
